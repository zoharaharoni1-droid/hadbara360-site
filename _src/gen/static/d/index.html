<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>מסמך מהדברה 360</title>
<meta property="og:title" content="הדברה 360 — המסמך שלך">
<meta property="og:description" content="לחצו כאן לצפייה במסמך ולהורדת PDF">
<meta property="og:image" content="https://hadbara360.co.il/assets/logo-square.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#16a34a">
<link rel="icon" href="/assets/icon.png">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,'Segoe UI',sans-serif;background:linear-gradient(180deg,#ecfdf5 0,#f0f9ff 340px,#f8fafc 700px);color:#0f172a;font-size:17px;line-height:1.55}
  .wrap{max-width:620px;margin:0 auto;padding:14px 12px 120px}
  .card{background:#fff;border-radius:18px;box-shadow:0 2px 14px rgba(15,23,42,.07);padding:18px 18px;margin-bottom:12px}
  .head{text-align:center;padding:22px 18px 18px}
  .head img{height:96px;max-width:70%;object-fit:contain}
  .co{font-size:21px;font-weight:800;margin-top:6px}
  .coinfo{font-size:15px;color:#475569;line-height:1.7}
  .coinfo a{color:#0369a1;text-decoration:none}
  .title{text-align:center;padding:16px 18px}
  .title h1{margin:0;font-size:26px;color:#15803d;font-weight:800;letter-spacing:.2px}
  .title .num{display:inline-block;margin-top:4px;font-size:22px;font-weight:800;color:#0f172a}
  .title .meta{font-size:15px;color:#64748b;margin-top:4px}
  .badge{display:inline-block;font-size:13px;font-weight:700;border-radius:20px;padding:3px 12px;margin:6px 4px 0}
  .draft{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:14px;padding:10px 14px;text-align:center;font-weight:700;font-size:15px;margin-bottom:12px}
  .lbl{font-size:14px;color:#64748b;font-weight:700;margin-bottom:6px}
  .to b{font-size:20px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #f1f5f9;font-size:17px}
  .row:last-child{border-bottom:none}
  .row span:first-child{color:#475569}
  .row span:last-child{font-weight:700;text-align:left;white-space:nowrap}
  .item{padding:12px 0;border-bottom:1px dashed #e2e8f0}
  .item:last-child{border-bottom:none}
  .item .d{font-size:18px;font-weight:700;margin-bottom:4px}
  .item .q{display:flex;justify-content:space-between;color:#475569;font-size:16px}
  .item .q b{color:#0f172a;font-size:18px}
  .sec{font-size:16px;font-weight:800;color:#fff;background:linear-gradient(90deg,#16a34a,#22c55e);border-radius:12px;padding:9px 14px;margin:-4px -4px 10px}
  .total{display:flex;justify-content:space-between;align-items:center;background:#16a34a;color:#fff;border-radius:14px;padding:14px 16px;margin-top:10px;font-size:19px;font-weight:800}
  .total span:last-child{font-size:26px}
  .bank .row span:last-child{direction:ltr}
  .cp{border:1px solid #bbf7d0;background:#f0fdf4;color:#166534;border-radius:10px;padding:2px 10px;font-size:13px;font-weight:700;margin-right:8px;cursor:pointer;font-family:inherit}
  .note{white-space:pre-wrap;font-size:16px}
  .orig{display:block;width:100%;border:1.5px solid #cbd5e1;background:#fff;color:#334155;border-radius:14px;padding:13px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;margin:6px 0 12px}
  #pages{display:flex;flex-direction:column;gap:12px}
  #pages canvas{width:100%;height:auto;background:#fff;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.10);display:block}
  #msg{text-align:center;color:#475569;padding:40px 16px;font-size:17px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);box-shadow:0 -2px 14px rgba(0,0,0,.10);padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
  .bar a,.bar button{flex:1;max-width:380px;display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:16px;padding:16px 10px;font-size:19px;font-weight:800;font-family:inherit;text-decoration:none;cursor:pointer}
  .dl{background:linear-gradient(90deg,#16a34a,#22c55e);color:#fff}
  .sh{background:#e0f2fe;color:#0369a1;max-width:140px!important}
  footer{text-align:center;font-size:14px;color:#64748b;margin:18px 0 0}
  footer a{color:#15803d;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="wrap" id="app"><div id="msg">⏳ טוען את המסמך…</div></div>
<div class="bar"><a class="dl" id="dl" href="#">⬇️ הורדת המסמך (PDF)</a><button class="sh" id="sh" type="button" style="display:none">📤 שיתוף</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
  var app=document.getElementById("app"), dl=document.getElementById("dl");
  var raw=(location.search||"").replace(/^\?/,"").split("&")[0];
  var id=decodeURIComponent(raw||"").replace(/[^0-9A-Za-z_-]/g,"");
  if(!id){ app.innerHTML='<div id="msg">הקישור אינו תקין.</div>'; dl.style.display="none"; return; }
  var parts=id.split("-"), first=parts[0]||"", d=parts[1]||"";
  var TYPES={R:"חשבונית מס/קבלה",I:"חשבונית מס",Q:"קבלה",C:"חשבונית זיכוי",E:"חשבון עסקה",D:"מסמך"};
  var code=/^[A-Z]/.test(first)?first.charAt(0):"", num=code?first.slice(1):first;
  var type=code?(TYPES[code]||"מסמך"):"יומן ביצוע";
  var date=d.length===6?(d.slice(0,2)+"/"+d.slice(2,4)+"/20"+d.slice(4,6)):"";
  document.title=type+" "+num+" — הדברה 360";
  var name=type.replace("/","-")+" "+num+" - הדברה 360"+(date?" - "+date.replace(/\//g,"."):"")+".pdf";
  var store="https://ilublhgawgfznxpdrfra.supabase.co/storage/v1/object/public/docs/";
  var pdfUrl=store+id+".pdf";
  dl.href=pdfUrl+"?download="+encodeURIComponent(name);
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function fd(s){ var m=String(s||"").match(/^(\d{4})-(\d{2})-(\d{2})$/); return m?m[3]+"/"+m[2]+"/"+m[1]:esc(s); }
  function row(l,v){ return v?'<div class="row"><span>'+esc(l)+'</span><span>'+esc(v)+'</span></div>':""; }

  function renderPdf(box,done){
    if(!window.pdfjsLib){ box.innerHTML='<div id="msg">לחצו על <b>הורדת המסמך</b> כדי לפתוח אותו.</div>'; return; }
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    pdfjsLib.getDocument(pdfUrl).promise.then(function(pdf){
      box.innerHTML=""; var dpr=Math.min(window.devicePixelRatio||1,3), w=Math.min(box.clientWidth||360,820), chain=Promise.resolve();
      for(var i=1;i<=pdf.numPages;i++)(function(n){ chain=chain.then(function(){ return pdf.getPage(n).then(function(pg){
        var v0=pg.getViewport({scale:1}), sc=(w/v0.width)*dpr, vp=pg.getViewport({scale:sc});
        var c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height; box.appendChild(c);
        return pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise; }); }); })(i);
      pdf.getData().then(function(bytes){ try{ var f=new File([bytes],name,{type:"application/pdf"});
        if(navigator.canShare&&navigator.canShare({files:[f]})){ var sh=document.getElementById("sh"); sh.style.display="flex";
          sh.onclick=function(){ navigator.share({files:[f],title:document.title}).catch(function(){}); }; } }catch(e){} });
      done&&done();
    }).catch(function(){ box.innerHTML='<div id="msg">המסמך לא נמצא או שהקישור פג.</div>'; dl.style.display="none"; });
  }

  function render(D){
    var c=D.company||{}, cu=D.cust||{}, h="";
    if(D.draft) h+='<div class="draft">טיוטה — לבדיקה בלבד, לא מסמך רשמי</div>';
    h+='<div class="card head">'+(c.logo?'<img src="'+esc(c.logo)+'" alt="">':'')+'<div class="co">'+esc(c.name)+'</div><div class="coinfo">'+
      (c.legal&&c.legal!==c.name?esc(c.legal)+'<br>':'')+(c.taxId?'עוסק מורשה '+esc(c.taxId)+'<br>':'')+(c.address?esc(c.address)+'<br>':'')+
      (c.phone?'<a href="tel:'+esc(c.phone)+'">📞 '+esc(c.phone)+'</a>':'')+(c.email?' · <a href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a>':'')+'</div></div>';
    h+='<div class="card title"><h1>'+esc(D.type)+'</h1><div class="num">'+esc(D.num)+'</div><div class="meta">תאריך: '+fd(D.date)+'</div>'+
      (D.copy?'<span class="badge" style="background:#f1f5f9;color:#334155">העתק נאמן למקור</span>':'')+(D.alloc?'<span class="badge" style="background:#ecfdf5;color:#166534">מספר הקצאה '+esc(D.alloc)+'</span>':'')+'</div>';
    h+='<div class="card to"><div class="lbl">לכבוד</div><b>'+esc(cu.name)+'</b>'+(cu.taxId?'<div style="color:#475569">ע.מ./ח.פ. '+esc(cu.taxId)+'</div>':'')+
      (cu.address?'<div>'+esc(cu.address)+'</div>':'')+(cu.contact?'<div>איש קשר: '+esc(cu.contact)+(cu.phone?' · '+esc(cu.phone):'')+'</div>':cu.phone?'<div>טלפון: '+esc(cu.phone)+'</div>':'')+
      (D.ref?'<div style="color:#475569;margin-top:6px">בהתייחס ל: '+esc(D.ref)+'</div>':'')+'</div>';
    if((D.lines||[]).length){ h+='<div class="card"><div class="sec">פירוט שירותים</div>';
      D.lines.forEach(function(l){ h+='<div class="item"><div class="d">'+esc(l.desc)+'</div><div class="q"><span>'+esc(l.qty)+' '+esc(l.unit)+' × '+esc(l.price)+'</span><b>'+esc(l.total)+'</b></div></div>'; });
      h+='<div style="margin-top:8px">'+(D.disc?row("הנחה","-"+D.disc):"")+row("סה״כ לפני מע״מ",D.before)+row("מע״מ "+D.vatRate+"%",D.vat)+'</div>';
      h+='<div class="total"><span>'+(D.credit?'סה״כ לזיכוי':'סה״כ לתשלום')+'</span><span>'+esc(D.total)+'</span></div></div>'; }
    if((D.pays||[]).length){ h+='<div class="card"><div class="sec">פרטי תשלום</div>';
      D.pays.forEach(function(p){ h+=row("אמצעי תשלום",p.method)+(p.details?row("פרטים",p.details):"")+row("תאריך",p.date)+row("סכום",p.amount); });
      if(!(D.lines||[]).length) h+='<div class="total"><span>סה״כ שולם</span><span>'+esc(D.total)+'</span></div>';
      h+='</div>'; }
    if(D.terms||D.due) h+='<div class="card">'+row("תנאי תשלום",D.terms)+row("לתשלום עד",D.due)+'</div>';
    if(D.notes) h+='<div class="card"><div class="lbl">הערות</div><div class="note">'+esc(D.notes)+'</div></div>';
    if(D.bank&&D.bank.account){ var b=D.bank; h+='<div class="card bank"><div class="sec">פרטים להעברה בנקאית</div>'+
      row("בנק",b.name+(b.code?" ("+b.code+")":""))+row("סניף",b.branch)+'<div class="row"><span>חשבון</span><span>'+esc(b.account)+'<button class="cp" data-cp="'+esc(b.account)+'">העתק</button></span></div>'+row("על שם",b.holder)+'</div>'; }
    h+='<button class="orig" id="origBtn" type="button">📄 הצג את המסמך המקורי</button><div id="pages"></div>';
    h+='<footer>'+esc(c.name||"הדברה 360")+(c.phone?' · <a href="tel:'+esc(c.phone)+'">'+esc(c.phone)+'</a>':'')+' · <a href="https://hadbara360.co.il">hadbara360.co.il</a></footer>';
    app.innerHTML=h;
    app.querySelectorAll(".cp").forEach(function(btn){ btn.onclick=function(){ try{ navigator.clipboard.writeText(btn.getAttribute("data-cp")); btn.textContent="✓ הועתק"; }catch(e){} }; });
    var ob=document.getElementById("origBtn"), box=document.getElementById("pages");
    ob.onclick=function(){ ob.style.display="none"; box.innerHTML='<div id="msg">⏳ טוען…</div>'; renderPdf(box); };
    // שיתוף הקובץ גם בלי לפתוח את המקור
    fetch(pdfUrl).then(function(r){ return r.ok?r.blob():null; }).then(function(bl){ if(!bl) return; try{ var f=new File([bl],name,{type:"application/pdf"});
      if(navigator.canShare&&navigator.canShare({files:[f]})){ var sh=document.getElementById("sh"); sh.style.display="flex"; sh.onclick=function(){ navigator.share({files:[f],title:document.title}).catch(function(){}); }; } }catch(e){} }).catch(function(){});
  }

  function fallback(){ app.innerHTML='<div class="card title"><h1>'+esc(type)+'</h1>'+(num?'<div class="num">'+esc(num)+'</div>':'')+(date?'<div class="meta">מתאריך '+esc(date)+'</div>':'')+'</div><div id="pages"><div id="msg">⏳ טוען את המסמך…</div></div>';
    renderPdf(document.getElementById("pages")); }

  function tryJson(urls){ if(!urls.length) return fallback();
    fetch(urls[0]+"?t="+Date.now()).then(function(r){ if(!r.ok) throw 0; return r.text(); }).then(function(t){ var D=JSON.parse(t); if(!D||!D.type) throw 0; render(D); })
      .catch(function(){ tryJson(urls.slice(1)); }); }
  if(code) tryJson([store+id+".json",store+id+"-data.pdf"]); else fallback();
})();
</script>
</body>
</html>

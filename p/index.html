<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>תשלום להדברה 360</title>
<meta property="og:title" content="הדברה 360 — בקשת תשלום">
<meta property="og:description" content="לחצו לתשלום מהיר ומילוי פרטים לחשבונית">
<meta property="og:image" content="https://hadbara360.co.il/assets/logo-square.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1a5c3a">
<link rel="icon" href="/assets/icon.png">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,'Segoe UI',sans-serif;background:#f3f7f5;color:#0f172a;-webkit-text-size-adjust:100%}
  header{background:#fff;padding:14px 16px 10px;text-align:center;box-shadow:0 1px 6px rgba(0,0,0,.05)}
  header img{height:44px}
  main{max-width:520px;margin:0 auto;padding:12px 12px 40px}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin-bottom:12px}
  .amt{text-align:center}
  .amt .lbl{font-size:14px;color:#475569}
  .amt .sum{font-size:40px;font-weight:900;color:#1a5c3a;margin:4px 0}
  .amt .desc{font-size:15px;color:#334155;line-height:1.5}
  h2{font-size:16px;margin:0 0 10px;color:#0f172a}
  .hint{font-size:13px;color:#64748b;margin:-4px 0 10px;line-height:1.5}
  label{display:block;font-size:13px;color:#475569;margin:8px 0 4px;font-weight:700}
  input{width:100%;padding:12px;border:1.5px solid #cbd5e1;border-radius:10px;font-size:16px;font-family:inherit;background:#fff}
  input:focus{outline:none;border-color:#16a34a}
  .row{display:flex;gap:8px}.row>div{flex:1;min-width:0}
  .m{border:1.5px solid #e2e8f0;border-radius:14px;margin-bottom:8px;overflow:hidden}
  .m>button{width:100%;display:flex;align-items:center;gap:10px;padding:14px;border:none;background:#fff;font-size:17px;font-weight:800;font-family:inherit;cursor:pointer;text-align:right;color:#0f172a}
  .m>button .ic{font-size:24px}.m>button .ar{margin-right:auto;color:#94a3b8}
  .m.on{border-color:#16a34a;background:#f0fdf4}.m.on>button{background:#f0fdf4}
  .m .body{display:none;padding:0 14px 14px;font-size:15px;line-height:1.7}
  .m.on .body{display:block}
  .kv{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #d1e7da;border-radius:10px;padding:8px 10px;margin:6px 0}
  .kv b{flex:1}
  .cp{border:1px solid #16a34a;background:#fff;color:#166534;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
  .big{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border:none;border-radius:14px;font-size:18px;font-weight:800;font-family:inherit;cursor:pointer;text-decoration:none}
  .go{background:#1a5c3a;color:#fff}
  .wa{background:#25D366;color:#fff}
  .soft{background:#e8f2ec;color:#1a5c3a}
  .ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;border-radius:12px;padding:12px;font-size:15px;text-align:center;font-weight:700}
  #msg{text-align:center;color:#475569;padding:40px 16px;font-size:16px}
  footer{text-align:center;font-size:12px;color:#7a8a80;padding:6px 0 30px}
  footer a{color:#1a5c3a}
</style>
</head>
<body>
<header><img src="/assets/logo.png" alt="הדברה 360" onerror="this.style.display='none'"></header>
<main id="app"><div id="msg">⏳ טוען את בקשת התשלום…</div></main>
<footer>הדברה 360 · <a href="tel:0559992266">055-9992266</a> · <a href="https://hadbara360.co.il">hadbara360.co.il</a></footer>
<script>
(function(){
  var app=document.getElementById("app");
  var STORE="https://ilublhgawgfznxpdrfra.supabase.co/storage/v1/object/public/docs/";
  var ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlsdWJsaGdhd2dmem54cGRyZnJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzMzMwNjAsImV4cCI6MjA5NjkwOTA2MH0.RMUX-pVuO4AGqtyGrAOxbW3RBPvBm6QnNeO0li6SY4E";
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function money(n){ var v=Math.round(Number(n||0)*100)/100; return "₪"+v.toLocaleString("he-IL",{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2}); }
  function b64dec(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; var bin=atob(s); var bytes=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
  function fail(t){ app.innerHTML='<div id="msg">'+esc(t)+'</div>'; }
  function load(){
    var h=(location.hash||"").replace(/^#/,"");
    if(h&&h.length>20){ try{ return Promise.resolve(JSON.parse(b64dec(h))); }catch(e){ return Promise.reject(e); } }
    var id=decodeURIComponent((location.search||"").replace(/^\?/,"").split("&")[0]||"").replace(/[^0-9A-Za-z_-]/g,"");
    if(!id) return Promise.reject(new Error("no id"));
    var get=function(ext){ return fetch(STORE+"p-"+id+ext,{cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); }).then(function(t){ return JSON.parse(t); }); };
    return get(".json").catch(function(){ return get(".pdf"); });
  }
  function copy(t,btn){ var done=function(){ var o=btn.textContent; btn.textContent="✓ הועתק"; setTimeout(function(){btn.textContent=o;},1500); };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done,function(){ prompt("העתיקו:",t); });
    else prompt("העתיקו:",t); }
  load().then(function(P){
    if(!P) return fail("בקשת התשלום לא נמצאה.");
    var open=!(Number(P.amount)>0), AM=open?"":String(P.amount);
    var AMT=function(){ return open?'<span class="amtv">—</span>':money(P.amount); };
    var C=P.cust||{}, biz=P.biz||{}, bizWa=String(biz.wa||"972559992266").replace(/\D/g,"");
    document.title=(open?"תשלום":"תשלום "+money(P.amount))+" — הדברה 360";
    var methods=[];
    if(P.gw&&P.gw.url) methods.push({k:"card",ic:"💳",t:"אשראי · ביט · אפל פיי · גוגל פיי",body:'<div class="hint">תשלום מאובטח בדף של חברת הסליקה. אפשר לחלק לתשלומים.</div><a class="big go" id="gwgo" href="'+esc(P.gw.url)+'">לתשלום מאובטח ←</a>'});
    if(P.bit&&P.bit.phone) methods.push({k:"bit",ic:"🔵",t:"ביט",body:'<div>פותחים את אפליקציית <b>ביט</b> ← העברת כסף ← למספר:</div><div class="kv"><b dir="ltr" style="text-align:right">'+esc(P.bit.phone)+'</b><button class="cp" data-c="'+esc(String(P.bit.phone).replace(/\D/g,""))+'">העתק</button></div><div class="kv"><span>סכום:</span><b>'+AMT()+'</b><button class="cp cpa" data-c="'+esc(AM)+'">העתק</button></div>'+(P.bit.name?'<div class="hint">על שם: '+esc(P.bit.name)+'</div>':"")});
    if(P.paybox&&P.paybox.phone) methods.push({k:"paybox",ic:"🟣",t:"פייבוקס",body:'<div>באפליקציית <b>פייבוקס</b> — העברה למספר:</div><div class="kv"><b dir="ltr" style="text-align:right">'+esc(P.paybox.phone)+'</b><button class="cp" data-c="'+esc(String(P.paybox.phone).replace(/\D/g,""))+'">העתק</button></div><div class="kv"><span>סכום:</span><b>'+AMT()+'</b></div>'});
    if(P.bank&&P.bank.account){ var B=P.bank; methods.push({k:"bank",ic:"🏦",t:"העברה בנקאית",body:
      '<div class="kv"><span>בנק:</span><b>'+esc(B.name)+(B.code?" ("+esc(B.code)+")":"")+'</b></div>'+
      '<div class="kv"><span>סניף:</span><b>'+esc(B.branch)+'</b><button class="cp" data-c="'+esc(B.branch)+'">העתק</button></div>'+
      '<div class="kv"><span>חשבון:</span><b>'+esc(B.account)+'</b><button class="cp" data-c="'+esc(B.account)+'">העתק</button></div>'+
      '<div class="kv"><span>על שם:</span><b>'+esc(B.holder)+'</b></div>'+
      '<div class="kv"><span>סכום:</span><b>'+AMT()+'</b><button class="cp cpa" data-c="'+esc(AM)+'">העתק</button></div>'}); }
    if(P.cash) methods.push({k:"cash",ic:"💵",t:"מזומן / צ׳ק למדביר",body:'<div class="hint">משלמים למדביר בביקור. בכל זאת כדאי למלא את הפרטים לחשבונית.</div>'});
    var html=''+
      '<div class="card amt"><div class="lbl">בקשת תשלום'+(P.date?" · "+esc(P.date):"")+'</div>'+(open?'<label style="text-align:center;margin-top:10px">כמה לשלם? (₪)</label><input id="f_amt" inputmode="decimal" style="text-align:center;font-size:26px;font-weight:800;color:#1a5c3a" placeholder="0">':'<div class="sum">'+money(P.amount)+'</div>')+
        '<div class="desc">'+esc(P.desc||"")+'</div>'+(P.note?'<div class="hint" style="margin-top:8px">'+esc(P.note)+'</div>':"")+'</div>'+
      '<div class="card"><h2>🧾 פרטים לחשבונית</h2><div class="hint">'+(C.name?"בדקו שהפרטים נכונים. אפשר לשנות — למשל לרשום את שם העסק שעל שמו תצא החשבונית.":"מלאו את הפרטים שעל שמם תצא החשבונית.")+'</div>'+
        '<label>שם לחשבונית (אדם או עסק)</label><input id="f_name" value="'+esc(C.name)+'" autocomplete="name">'+
        '<div class="row"><div><label>ח.פ. / ת.ז. (לא חובה)</label><input id="f_tax" inputmode="numeric" value="'+esc(C.taxId)+'"></div><div><label>טלפון</label><input id="f_phone" type="tel" dir="ltr" style="text-align:right" value="'+esc(C.phone)+'" autocomplete="tel"></div></div>'+
        '<label>אימייל לקבלת החשבונית (לא חובה)</label><input id="f_email" type="email" dir="ltr" style="text-align:right" value="'+esc(C.email)+'" autocomplete="email">'+
        '<label>כתובת (לא חובה)</label><input id="f_addr" value="'+esc(C.address)+'" autocomplete="street-address">'+
      '</div>'+
      '<div class="card"><h2>💰 איך תרצו לשלם?</h2>'+
        (methods.length?methods.map(function(m,i){ return '<div class="m" data-k="'+m.k+'"><button type="button"><span class="ic">'+m.ic+'</span>'+esc(m.t)+'<span class="ar">▾</span></button><div class="body">'+m.body+'</div></div>'; }).join(""):'<div class="hint">צרו קשר לתיאום התשלום.</div>')+
      '</div>'+
      '<div class="card" id="done"><button class="big go" id="send" type="button">✅ שילמתי — שליחת אישור ופרטים</button><div class="hint" style="margin:8px 0 0;text-align:center">אחרי שנאשר שהתשלום התקבל, החשבונית / הקבלה תישלח אליכם.</div></div>';
    app.innerHTML=html;
    var chosen="";
    Array.prototype.forEach.call(app.querySelectorAll(".m>button"),function(b){ b.onclick=function(){ var m=b.parentNode, on=!m.classList.contains("on");
      Array.prototype.forEach.call(app.querySelectorAll(".m"),function(x){x.classList.remove("on");}); if(on){ m.classList.add("on"); chosen=m.getAttribute("data-k"); } else chosen=""; }; });
    if(methods.length===1){ app.querySelector(".m").classList.add("on"); chosen=methods[0].k; }
    Array.prototype.forEach.call(app.querySelectorAll(".cp"),function(b){ b.onclick=function(e){ e.stopPropagation(); copy(b.getAttribute("data-c"),b); }; });
    var curAmt=function(){ if(!open) return Number(P.amount); var x=parseFloat(String((document.getElementById("f_amt")||{}).value||"").replace(/[^0-9.]/g,"")); return x>0?x:0; };
    if(open){ document.getElementById("f_amt").oninput=function(){ var a=curAmt(); Array.prototype.forEach.call(app.querySelectorAll(".amtv"),function(e){ e.textContent=a?money(a):"—"; }); Array.prototype.forEach.call(app.querySelectorAll(".cpa"),function(e){ e.setAttribute("data-c",a?String(a):""); }); }; }
    var v=function(id){ return (document.getElementById(id).value||"").trim(); };
    var names={card:"אשראי",bit:"ביט",paybox:"פייבוקס",bank:"העברה בנקאית",cash:"מזומן / צ׳ק"};
    document.getElementById("send").onclick=function(){
      if(open&&!curAmt()){ alert("נא לרשום את הסכום ששילמתם"); document.getElementById("f_amt").focus(); return; }
      if(!v("f_name")){ alert("נא לרשום שם לחשבונית"); document.getElementById("f_name").focus(); return; }
      var t=["שלום, כאן "+v("f_name")+" 👋",
        "שילמתי "+money(curAmt())+(chosen?" ב"+names[chosen]:"")+(P.desc?" עבור: "+P.desc:""),
        P.ref?"מספר בקשה: "+P.ref:"","",
        "פרטים לחשבונית:","שם: "+v("f_name"),
        v("f_tax")?"ח.פ./ת.ז.: "+v("f_tax"):"", v("f_phone")?"טלפון: "+v("f_phone"):"",
        v("f_email")?"אימייל: "+v("f_email"):"", v("f_addr")?"כתובת: "+v("f_addr"):""].filter(function(x,i,a){ return x!==""||(i>0&&a[i-1]!==""); }).join("\n");
      var rec={ref:P.ref||"",req_id:(location.search||"").replace(/^\?/,"").split("&")[0]||"",amount:curAmt(),method:chosen?names[chosen]:"",name:v("f_name"),tax_id:v("f_tax"),phone:v("f_phone"),email:v("f_email"),address:v("f_addr"),descr:P.desc||""};
      var btn=document.getElementById("send"); btn.disabled=true; btn.textContent="⏳ שולח…";
      var go=function(){ location.href="https://wa.me/"+bizWa+"?text="+encodeURIComponent(t); };
      var done=function(ok){ document.getElementById("done").innerHTML='<div class="ok">'+(ok?"✅ תודה! הדיווח התקבל אצלנו.":"✅ תודה!")+'<br><span style="font-weight:400;font-size:14px">החשבונית / הקבלה תישלח אליכם אחרי שנאשר את קבלת התשלום.</span></div><button class="big soft" id="wa2" type="button" style="margin-top:10px">💬 שליחת הודעה בוואטסאפ (לא חובה)</button>'; document.getElementById("wa2").onclick=go; };
      try{
        fetch("https://ilublhgawgfznxpdrfra.supabase.co/rest/v1/pay_reports",{method:"POST",headers:{"Content-Type":"application/json","apikey":ANON,"Authorization":"Bearer "+ANON,"Prefer":"return=minimal"},body:JSON.stringify(rec)})
          .then(function(r){ if(r.ok) done(true); else go(); }).catch(go);
      }catch(e){ go(); }
    };
  }).catch(function(){ fail("בקשת התשלום לא נמצאה או שהקישור אינו תקין."); });
})();
</script>
</body>
</html>
